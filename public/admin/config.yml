backend:
  name: github
  repo: "Astroblazter/Domik-v-kolomne3"
  branch: "cloudflare-cms-test"
  base_url: "https://domik-oauth-proxy.orlovdove.workers.dev"
  auth_endpoint: "auth"

media_folder: "public/images"
public_folder: "/images"
locale: ru

collections:
  - name: "news"
    label: "Новости"
    folder: "src/content/news"
    create: true
    slug: "{{year}}-{{month}}-{{day}}-{{slug}}"
    fields:
      - { label: "Заголовок", name: "title", widget: "string" }
      - { label: "Дата", name: "date", widget: "datetime" }
      - { label: "Фото анонса", name: "image", widget: "image" }
      - { label: "Краткое описание", name: "preview", widget: "text" }
      - { label: "Текст", name: "body", widget: "markdown" }

  - name: "team"
    label: "Труппа"
    folder: "src/content/team"
    create: true
    extension: "json"
    format: "json"
    slug: "{{slug}}"
    fields:
      - { label: "Имя", name: "name", widget: "string" }
      - { label: "Фото", name: "photo", widget: "image" }
      - { label: "Роль", name: "role", widget: "string" }
      - { label: "Краткая биография", name: "shortBio", widget: "text" }
      - { label: "Роли в театре", name: "theatreRoles", widget: "string" }

  - name: "director"
    label: "Режиссёр"
    files:
      - name: "director"
        label: "Режиссёр"
        file: "src/content/director.json"
        fields:
          - { label: "Имя", name: "name", widget: "string" }
          - { label: "Фото", name: "photo", widget: "image" }
          - { label: "Роль", name: "role", widget: "string" }
          - { label: "Краткая биография", name: "shortBio", widget: "text" }
          - { label: "Роли в театре", name: "theatreRoles", widget: "string" }

  - name: "performances"
    label: "Спектакли"
    folder: "src/content/performances"
    create: true
    extension: "json"
    format: "json"
    slug: "{{slug}}"
    fields:
      - { label: "Название", name: "title", widget: "string" }
      - { label: "Автор", name: "author", widget: "string" }
      - { label: "Длительность", name: "duration", widget: "string" }
      - { label: "Возрастное ограничение", name: "age", widget: "string" }
      - { label: "Обложка", name: "image", widget: "image" }
      - { label: "Описание", name: "description", widget: "text" }
      - { label: "Статус", name: "status", widget: "string", hint: "например: в репертуаре / премьера сезона" }

  - name: "contacts"
    label: "Контакты"
    files:
      - name: "contacts"
        label: "Контакты"
        file: "src/content/contacts.json"
        fields:
          - { label: "Название театра", name: "name", widget: "string" }
          - { label: "Вступительный текст", name: "intro", widget: "text", default: "Наша основная площадка, где мы собираемся, проводим репетиции и выступаем, находится в историческом центре Санкт-Петербурга. Но мы с радостью приедем к Вам! Пожалуйста, пишите и звоните ))" }
          - { label: "Город", name: "city", widget: "string" }
          - { label: "Адрес", name: "address", widget: "string" }
          - { label: "Телефон", name: "phone", widget: "string" }
          - { label: "Email", name: "email", widget: "string" }
          - label: "Соцсети"
            name: "socials"
            widget: "list"
            fields:
              - { label: "Название", name: "label", widget: "string" }
              - { label: "Ссылка", name: "href", widget: "string" }

  - name: "schedule"
    label: "Афиша"
    folder: "src/content/schedule"
    create: true
    extension: "json"
    format: "json"
    slug: "{{slug}}"
    fields:
      - { label: "Дата", name: "date", widget: "string", hint: "например: 15 сентября" }
      - { label: "Время", name: "time", widget: "string", hint: "например: 18:00" }
      - { label: "Площадка", name: "venue", widget: "string" }
      - { label: "Спектакль", name: "performance", widget: "string" }

  - name: "gallery"
    label: "Галерея"
    files:
      - name: "gallery"
        label: "Галерея"
        file: "src/content/gallery.json"
        fields:
          - label: "Фотографии"
            name: "images"
            widget: "list"
            field: { label: "Фото", name: "image", widget: "image" }

  - name: "video"
    label: "Видео"
    folder: "src/content/video"
    create: true
    extension: "json"
    format: "json"
    slug: "{{slug}}"
    fields:
      - { label: "Обложка (постер)", name: "poster", widget: "image" }
      - { label: "Название", name: "title", widget: "string" }

  - name: "about"
    label: "О театре"
    files:
      - name: "about"
        label: "О театре"
        file: "src/content/about.json"
        fields:
          - { label: "Фото (основное)", name: "image", widget: "image" }
          - { label: "Фото (дополнительное)", name: "imageWide", widget: "image" }
          - { label: "Текст-плашка", name: "badge", widget: "string" }
          - label: "Абзацы текста"
            name: "paragraphs"
            widget: "list"
            field: { label: "Абзац", name: "paragraph", widget: "text" }
          - { label: "Цитата", name: "quote", widget: "text" }
          - label: "Факты"
            name: "facts"
            widget: "list"
            fields:
              - { label: "Значение", name: "value", widget: "string" }
              - { label: "Подпись", name: "label", widget: "string" }

  - name: "support"
    label: "Поддержать театр"
    files:
      - name: "support"
        label: "Поддержать театр"
        file: "src/content/support.json"
        fields:
          - { label: "Фоновое фото", name: "image", widget: "image" }
          - { label: "Вступительный текст", name: "lead", widget: "text" }
          - label: "На что идут пожертвования"
            name: "uses"
            widget: "list"
            field: { label: "Пункт", name: "use", widget: "string" }
          - label: "Способы поддержки"
            name: "options"
            widget: "list"
            fields:
              - { label: "Название", name: "label", widget: "string" }
              - { label: "Описание", name: "description", widget: "text" }
              - { label: "Ссылка", name: "href", widget: "string" }
          - { label: "Подпись под кнопкой", name: "buttonNote", widget: "string" }

  - name: "hero"
    label: "Главный экран"
    files:
      - name: "hero"
        label: "Главный экран"
        file: "src/content/hero.json"
        fields:
          - { label: "Фоновое фото", name: "image", widget: "image" }
          - { label: "Город (подпись сверху)", name: "eyebrow", widget: "string" }
          - { label: "Заголовок (первая строка)", name: "titleLine1", widget: "string" }
          - { label: "Заголовок (курсивом)", name: "titleItalic", widget: "string" }
          - { label: "Подзаголовок", name: "subtitle", widget: "string" }
          - { label: "Описание", name: "description", widget: "text" }

  - name: "branding"
    label: "Логотип и название"
    files:
      - name: "branding"
        label: "Логотип и название"
        file: "src/content/branding.json"
        fields:
          - { label: "Логотип", name: "logo", widget: "image", required: false, hint: "Если не загружено — используется стандартный логотип" }
          - { label: "Название театра (в шапке)", name: "siteName", widget: "string" }
          - { label: "Подпись (в шапке)", name: "tagline", widget: "string" }
          - { label: "Описание (в подвале сайта)", name: "footerDescription", widget: "text" }

  - name: "reviews"
    label: "Отзывы"
    folder: "src/content/reviews"
    create: true
    extension: "json"
    format: "json"
    slug: "{{slug}}"
    fields:
      - { label: "Ключевая фраза (для превью)", name: "keyPhrase", widget: "text", hint: "Короткая цитата — будет видна на карточке до открытия полного текста" }
      - { label: "Полный текст отзыва", name: "fullText", widget: "text" }
      - { label: "Автор", name: "author", widget: "string" }
      - { label: "Источник", name: "source", widget: "string" }

  - name: "partners"
    label: "Нам помогают"
    folder: "src/content/partners"
    create: true
    extension: "json"
    format: "json"
    slug: "{{slug}}"
    fields:
      - { label: "Логотип", name: "logo", widget: "image", required: false, hint: "Если не загружен — вместо него покажется название" }
      - { label: "Полное название", name: "name", widget: "string" }
      - { label: "Ссылка на сайт партнёра", name: "url", widget: "string", required: false }
